[project]
name = "restaurantreservationsystem"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "pymysql[rsa]>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.52",
]

[tool.uv.workspace]
members = [
    "restaurant_ordering_system",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
